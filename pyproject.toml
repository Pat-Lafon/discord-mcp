[project]
name = "discord-mcp"
version = "0.2.0"
description = "Discord MCP server for reading Discord messages"
readme = "README.md"
authors = [
    { name = "elyx", email = "elio@pascarelli.com" }
]
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.52.0",
    "mcp>=1.9.3",
    "python-dotenv>=1.1.0",
    "typing-extensions>=4.14.0",
]

[project.scripts]
discord-mcp = "discord_mcp:main"

[tool.ruff]
# 88 is ruff's own default, so this looks redundant and is not: without a
# [tool.ruff] section here, discovery walks up out of the repo and takes the
# settings of whatever project it is checked out inside. In the vault that is
# line-length 100, which reformats this code into a CI failure.
line-length = 88

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.401",
    "ruff>=0.11.13",
]
